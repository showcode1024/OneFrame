name: Publish Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify version tag and release notes
        run: |
          python3 tools/prepare-release.py --validate-only
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore project signing key
        env:
          ONEFRAME_KEYSTORE_BASE64: ${{ secrets.ONEFRAME_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get("ONEFRAME_KEYSTORE_BASE64", "")
          if not value:
              raise SystemExit("Configure the OneFrame signing secrets before publishing")
          destination = Path(os.environ["RUNNER_TEMP"]) / "oneframe-release.jks"
          destination.write_bytes(base64.b64decode(value, validate=True))
          destination.chmod(0o600)
          PY
      - name: Build signed APK, test and lint
        env:
          ONEFRAME_KEYSTORE_PATH: ${{ runner.temp }}/oneframe-release.jks
          ONEFRAME_STORE_PASSWORD: ${{ secrets.ONEFRAME_STORE_PASSWORD }}
          ONEFRAME_KEY_ALIAS: ${{ secrets.ONEFRAME_KEY_ALIAS }}
          ONEFRAME_KEY_PASSWORD: ${{ secrets.ONEFRAME_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Prepare and verify release assets
        run: |
          python3 tools/prepare-release.py
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk > "$RUNNER_TEMP/oneframe-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/*.apk
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          expected = Path("docs/release-signing.sha256").read_text().strip().lower()
          report = (Path(os.environ["RUNNER_TEMP"]) / "oneframe-signature.txt").read_text()
          match = re.search(r"Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]+)", report)
          if not match or match.group(1).lower() != expected:
              raise SystemExit("APK signing identity does not match the committed project certificate")
          print("Verified the fixed OneFrame signing certificate")
          PY
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OneFrame-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          # Stage these releases while their exact signed APKs are checked with Play Protect.
          if [[ "$RELEASE_TAG" == "v0.1.6-alpha" || "$RELEASE_TAG" == "v0.1.7-alpha" ]]; then flags+=(--draft); fi
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.sha256 \
            --verify-tag --title "OneFrame $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" "${flags[@]}"
      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oneframe-release.jks"
